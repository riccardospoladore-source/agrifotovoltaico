<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Concettuale Espandibile: Prove Agrivoltaiche</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            padding: 40px;
            line-height: 1.6;
        }
        h1 {
            color: #102a43;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .media-container {
            text-align: center;
            margin-bottom: 40px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .media-container h3 {
            margin-top: 0;
            color: #243b53;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        
        audio {
            width: 100%;
            max-width: 400px;
            outline: none;
            margin-bottom: 20px;
        }

        .quiz-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        .quiz-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        .tree {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        details {
            margin: 10px 0 10px 20px;
            padding-left: 15px;
            border-left: 2px solid #bcccdc;
        }

        details.root {
            margin-left: 0;
            padding-left: 0;
            border-left: none;
        }

        summary {
            cursor: pointer;
            font-weight: 600;
            color: #243b53;
            padding: 8px 12px;
            background-color: #e2e8f0;
            border-radius: 6px;
            list-style: none;
            transition: background-color 0.2s ease;
            position: relative;
            display: inline-block;
        }

        summary::-webkit-details-marker { display: none; }
        summary:hover { background-color: #cbd5e1; }

        summary::before {
            content: '▶';
            display: inline-block;
            margin-right: 8px;
            font-size: 0.8em;
            color: #627d98;
            transition: transform 0.2s ease;
        }

        details[open] > summary::before { transform: rotate(90deg); }

        .leaf {
            margin: 8px 0 8px 30px;
            padding: 8px 12px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.95em;
            position: relative;
        }

        .leaf::before {
            content: '•';
            color: #9fb3c8;
            position: absolute;
            left: -15px;
        }

        details.root > summary {
            background-color: #102a43;
            color: #f0f4f8;
            font-size: 1.1em;
        }
        details.root > summary::before { color: #bcccdc; }
        details.level-1 > summary { background-color: #334e68; color: white; }
        details.level-2 > summary { background-color: #bcccdc; color: #102a43; }
    </style>
</head>
<body>

    <h1>Risultati delle Speriment
